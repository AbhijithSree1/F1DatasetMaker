[project]
name = "f1datasetmaker"
version = "0.1.0"
description = "Automated pipeline that pulls F1 timing/telemetry data from OpenF1 and FastF1 and builds ML-ready datasets for vehicle, driver, strategy, and tire models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastf1>=3.3",
    "requests>=2.31",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "typer>=0.12",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "requests-mock>=1.12",
    "ruff>=0.4",
]

[project.scripts]
f1dataset = "f1dataset.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
